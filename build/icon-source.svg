<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#252830"/>
      <stop offset="0.34" stop-color="#16181d"/>
      <stop offset="0.72" stop-color="#0d0e12"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <radialGradient id="bgHalo" cx="0.5" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#e8ce97" stop-opacity="0.30"/>
      <stop offset="0.38" stop-color="#b18f58" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b18f58" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4dfae" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#b18f58" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#b18f58" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3d2" stop-opacity="0.92"/>
      <stop offset="0.24" stop-color="#d9b87e" stop-opacity="0.56"/>
      <stop offset="0.55" stop-color="#6d5737" stop-opacity="0.22"/>
      <stop offset="0.8" stop-color="#cfae74" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff3d2" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff2cd"/>
      <stop offset="0.22" stop-color="#e4c78e"/>
      <stop offset="0.55" stop-color="#b68d52"/>
      <stop offset="0.82" stop-color="#d8b77d"/>
      <stop offset="1" stop-color="#8d6b3d"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#f7e9c8"/>
      <stop offset="0.35" stop-color="#d5b277"/>
      <stop offset="0.68" stop-color="#946f3f"/>
      <stop offset="1" stop-color="#f1dcaa"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6c3d"/>
      <stop offset="0.6" stop-color="#4d3a20"/>
      <stop offset="1" stop-color="#21180d"/>
    </linearGradient>
    <linearGradient id="metalFront" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3b3a36"/>
      <stop offset="0.16" stop-color="#22231f"/>
      <stop offset="0.5" stop-color="#15161a"/>
      <stop offset="0.84" stop-color="#0e0f12"/>
      <stop offset="1" stop-color="#2a2620"/>
    </linearGradient>
    <linearGradient id="metalLeft" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#57513f"/>
      <stop offset="0.4" stop-color="#2b2924"/>
      <stop offset="1" stop-color="#141412"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#24231f"/>
      <stop offset="0.45" stop-color="#151410"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#3a342a"/>
      <stop offset="0.45" stop-color="#1d1b16"/>
      <stop offset="1" stop-color="#11110f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.38" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.22" stop-color="#f8e8bd"/>
      <stop offset="0.55" stop-color="#e2c188"/>
      <stop offset="0.82" stop-color="#b98f52"/>
      <stop offset="1" stop-color="#7d5a2c"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e4b7" stop-opacity="0.8"/>
      <stop offset="0.36" stop-color="#e4c184" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c69a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#f7e8c6" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#e6ca97" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff7de" stop-opacity="0.85"/>
      <stop offset="0.82" stop-color="#caa467" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f7e8c6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2cc" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#fff2cc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0.15" y2="0">
      <stop offset="0" stop-color="#f8e6bd" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f8e6bd" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff8e6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurHuge" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="blurBig" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blurMid" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurSoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft"><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="soft-light"/>
    </filter>
    <clipPath id="squircle"><rect x="34" y="34" width="956" height="956" rx="236"/></clipPath>
    <clipPath id="frontOrbit"><rect x="0" y="600" width="1024" height="424"/></clipPath>
    <clipPath id="backOrbit"><rect x="0" y="0" width="1024" height="640"/></clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="34" y="34" width="956" height="956" fill="url(#bgBase)"/>
    <rect x="34" y="34" width="956" height="956" fill="url(#bgHalo)"/>
    <g filter="url(#grain)">
      <rect x="34" y="34" width="956" height="956" fill="#000" opacity="0"/>
    </g>

    <!-- 星尘与柔光 -->
    <g fill="#f4e1b7">
      <circle cx="188" cy="286" r="1.6" opacity="0.5"/>
      <circle cx="262" cy="190" r="1.1" opacity="0.35"/>
      <circle cx="822" cy="238" r="1.4" opacity="0.5"/>
      <circle cx="868" cy="348" r="0.9" opacity="0.3"/>
      <circle cx="156" cy="522" r="1" opacity="0.3"/>
      <circle cx="872" cy="576" r="1.2" opacity="0.32"/>
      <circle cx="236" cy="714" r="1.1" opacity="0.24"/>
      <circle cx="790" cy="720" r="1.3" opacity="0.2"/>
    </g>
    <circle cx="512" cy="414" r="330" fill="url(#underGlow)" opacity="0.5" filter="url(#blurHuge)"/>
    <path d="M512 120 L664 700 L360 700 Z" fill="url(#beam)" filter="url(#blurBig)" opacity="0.65"/>
    <path d="M512 174 L610 660 L414 660 Z" fill="url(#beam)" opacity="0.4" filter="url(#blurMid)"/>

    <!-- 悬浮底座阴影与辉光 -->
    <ellipse cx="512" cy="816" rx="330" ry="76" fill="url(#floorShadow)" filter="url(#blurBig)"/>
    <ellipse cx="512" cy="790" rx="238" ry="54" fill="url(#underGlow)" opacity="0.8" filter="url(#blurBig)"/>

    <!-- 悬浮石台：底部锥形、三层环 -->
    <g>
      <path d="M246 706 C330 770 401 792 512 844 C624 792 695 770 778 706 L778 690 L246 690 Z" fill="url(#stoneDark)"/>
      <path d="M246 706 C326 764 394 785 512 836 C630 785 698 764 778 706 L778 730 C694 792 620 812 512 862 C404 812 330 792 246 730 Z" fill="#070707" opacity="0.85"/>
      <path d="M248 728 C340 786 410 806 512 852" stroke="#c9a86a" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>
      <path d="M776 728 C684 786 614 806 512 852" stroke="#f0d9a3" stroke-opacity="0.16" stroke-width="1" fill="none"/>
      <path d="M316 758 H708" stroke="#f0d9a3" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M356 788 H668" stroke="#f0d9a3" stroke-opacity="0.08" stroke-width="1"/>

      <!-- 台座三层 -->
      <ellipse cx="512" cy="714" rx="288" ry="104" fill="url(#stoneDark)"/>
      <ellipse cx="512" cy="692" rx="282" ry="99" fill="url(#stoneTop)"/>
      <ellipse cx="512" cy="692" rx="282" ry="99" fill="none" stroke="url(#goldEdge)" stroke-width="3.2" opacity="0.9"/>
      <ellipse cx="512" cy="680" rx="282" ry="99" fill="none" stroke="#fff0c8" stroke-opacity="0.12" stroke-width="1.2"/>
      <path d="M258 674 C318 610 415 578 512 578 C609 578 706 610 766 674" fill="none" stroke="#f8eccd" stroke-opacity="0.19" stroke-width="2" filter="url(#blurSoft)"/>

      <ellipse cx="512" cy="662" rx="200" ry="76" fill="url(#stoneDark)"/>
      <ellipse cx="512" cy="646" rx="196" ry="72" fill="url(#stoneTop)"/>
      <ellipse cx="512" cy="646" rx="196" ry="72" fill="none" stroke="url(#goldEdge)" stroke-width="2.6" opacity="0.85"/>
      <path d="M330 632 C380 584 444 560 512 560 C580 560 644 584 694 632" fill="none" stroke="#fff0c8" stroke-opacity="0.16" stroke-width="1.6" filter="url(#blurSoft)"/>

      <ellipse cx="512" cy="612" rx="118" ry="50" fill="url(#stoneDark)"/>
      <ellipse cx="512" cy="600" rx="114" ry="47" fill="url(#stoneTop)"/>
      <ellipse cx="512" cy="600" rx="114" ry="47" fill="none" stroke="url(#goldEdge)" stroke-width="2.2" opacity="0.8"/>
    </g>

    <!-- 悬浮轨道环（后半） -->
    <g clip-path="url(#backOrbit)" opacity="0.75">
      <ellipse cx="512" cy="532" rx="392" ry="142" fill="none" stroke="url(#orbit)" stroke-width="2.2" transform="rotate(-14 512 532)"/>
      <ellipse cx="512" cy="532" rx="392" ry="142" fill="none" stroke="#fff4d8" stroke-opacity="0.10" stroke-width="1" transform="rotate(-14 512 532)" filter="url(#blurSoft)"/>
    </g>

    <!-- 悬浮太阳 -->
    <circle cx="512" cy="310" r="168" fill="url(#sunHalo)" filter="url(#blurHuge)"/>
    <circle cx="512" cy="310" r="106" fill="#e9cb92" opacity="0.18" filter="url(#blurBig)"/>
    <circle cx="512" cy="310" r="76" fill="url(#sun)"/>
    <ellipse cx="492" cy="286" rx="42" ry="32" fill="#fff9e8" opacity="0.55" filter="url(#blurMid)"/>
    <circle cx="512" cy="310" r="76" fill="none" stroke="#fff3d2" stroke-opacity="0.28" stroke-width="1.1"/>
    <circle cx="512" cy="310" r="92" fill="none" stroke="#f4dcae" stroke-opacity="0.12" stroke-width="1"/>

    <!-- 2.5D 悬浮 M 主体：背板金面、侧面、正面 -->
    <g>
      <!-- 抛出的金色顶面（偏移 -34,-28） -->
      <path d="M288 676 L288 344 L392 344 L512 506 L632 344 L736 344 L736 676 L642 676 L642 458 L512 650 L382 458 L382 676 Z"
            fill="url(#goldTop)"/>
      <!-- 厚度的侧面 -->
      <path d="M736 344 L770 372 L770 704 L736 676 Z" fill="url(#goldDark)"/>
      <path d="M642 676 L642 458 L512 650 L512 686 L642 494 Z" fill="#17140f" opacity="0.55"/>
      <path d="M288 344 L254 372 L254 704 L288 676 Z" fill="#0f0e0c" opacity="0.7"/>
      <path d="M288 676 L254 704 L642 704 L642 676 Z" fill="#120f0b" opacity="0.8"/>
      <!-- 正面金属 M -->
      <path d="M322 676 L322 372 L408 372 L512 516 L616 372 L702 372 L702 676 L628 676 L628 484 L512 650 L396 484 L396 676 Z"
            fill="url(#metalFront)" stroke="url(#goldEdge)" stroke-width="3"/>
      <!-- 正面高光/内倒角 -->
      <path d="M329 668 L329 380 L406 380 L512 522 L618 380 L695 380" fill="none" stroke="#fff0cd" stroke-opacity="0.22" stroke-width="1.6"/>
      <path d="M628 484 L628 664" stroke="#f6e2b4" stroke-opacity="0.16" stroke-width="2"/>
      <path d="M396 484 L396 664" stroke="#000" stroke-opacity="0.45" stroke-width="2"/>
      <path d="M512 520 L512 636" stroke="#000" stroke-opacity="0.32" stroke-width="1.4"/>
      <path d="M512 522 L512 646" stroke="#f6e2b4" stroke-opacity="0.08" stroke-width="1"/>
      <!-- 金色棱边点缀 -->
      <path d="M322 372 L408 372 L512 516 L616 372 L702 372" fill="none" stroke="#ffe9b8" stroke-opacity="0.5" stroke-width="3" filter="url(#blurSoft)"/>
      <circle cx="322" cy="372" r="3.4" fill="#f6e5bb"/>
      <circle cx="702" cy="372" r="3.4" fill="#f6e5bb"/>
      <circle cx="512" cy="516" r="2.6" fill="#f6e5bb"/>
      <!-- 底部接触反光 -->
      <ellipse cx="512" cy="678" rx="210" ry="16" fill="#f4dfae" opacity="0.10" filter="url(#blurMid)"/>
    </g>

    <!-- 轨道前半压在 M 上 -->
    <g clip-path="url(#frontOrbit)" opacity="0.9">
      <ellipse cx="512" cy="532" rx="392" ry="142" fill="none" stroke="url(#orbit)" stroke-width="2.4" transform="rotate(-14 512 532)"/>
      <ellipse cx="512" cy="532" rx="392" ry="142" fill="none" stroke="#fff4d8" stroke-opacity="0.16" stroke-width="1" transform="rotate(-14 512 532)" filter="url(#blurSoft)"/>
      <circle cx="150" cy="588" r="3.2" fill="#fff0c9"/>
      <circle cx="874" cy="462" r="2.6" fill="#f5dfb4"/>
    </g>

    <!-- 悬浮粒子与反射 -->
    <g>
      <circle cx="300" cy="386" r="2.1" fill="#f8e8c6" opacity="0.7"/>
      <circle cx="716" cy="470" r="1.8" fill="#f8e8c6" opacity="0.55"/>
      <circle cx="656" cy="260" r="1.6" fill="#f8e8c6" opacity="0.45"/>
      <circle cx="382" cy="250" r="1.3" fill="#f8e8c6" opacity="0.4"/>
      <path d="M512 786 L512 950" stroke="url(#reflection)" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- 内缘 -->
    <rect x="34" y="34" width="956" height="956" rx="236" fill="none" stroke="url(#rim)" stroke-width="2.4"/>
    <rect x="54" y="54" width="916" height="916" rx="218" fill="none" stroke="#fff2d0" stroke-opacity="0.07" stroke-width="1.2"/>
  </g>
  <rect x="34" y="34" width="956" height="956" rx="236" fill="none" stroke="url(#rim)" stroke-width="2.6"/>
</svg>
